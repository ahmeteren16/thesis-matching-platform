<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<form th:action="@{/themen/add}" method="post" th:object="${thema}">
  <div>
    <label for="titel">Titel</label><br/>
    <input id="titel" name="titel" type="text" required th:field="*{titel}" />
  </div>

  <div>
    <label for="beschreibung">Beschreibung</label><br/>
    <input id="beschreibung" name="beschreibung" type="text" th:field="*{beschreibung}" />
  </div>


  <fieldset>
    <legend>Voraussetzungen</legend>

    <div>
      <input id="voraussetzung1" name="voraussetzungen" type="text" th:field="*{voraussetzungen}" />
    </div>
    <div>
      <input id="voraussetzung2" name="voraussetzungen" type="text" th:field="*{voraussetzungen}"  />
    </div>
    <div>
      <input id="voraussetzung3" name="voraussetzungen" type="text" th:field="*{voraussetzungen}"  />
    </div>

  </fieldset>

  <div style="margin-top: 12px;">
    <button type="submit">Speichern</button>
  </div>

</form>
<br>

<h2>Thema zuweisen</h2>
<form th:action="@{/matching/assign}" method="post">
  <label for="titel1">Thema:</label>
  <select name="titel1" id="titel1">
    <option th:each="t : ${themen}" th:value="${t.titel}" th:text="${t.titel}"></option>
  </select>
  <br>
  <label for="betreuerId">Betreuer:</label>
  <select name="betreuerId" id="betreuerId">
    <option th:each="b : ${betreuer}" th:value="${b.id}" th:text="${b.name}"></option>
  </select>
  <br>
  <button type="submit">Zuweisen</button>
</form>
<br>

<a th:href="@{/}">Zurück zur Startseite</a>

<div th:if="${errorMessage}"
     th:text="${errorMessage}"
     class="error">
</div>

</body>
</html>
